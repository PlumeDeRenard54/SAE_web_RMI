<!doctype html>
<head>
  <meta charset="utf-8" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
    crossorigin="anonymous"
  />

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Local JS -->
  <script src="js/index.js" defer></script>
</head>

<body class="card m-3 bg-dark">
  <div id="mainbox" class="bg-light">
    <div>
      <header class="m-2">
        <ul class="nav nav-pills">
          <li id="mappage-button" class="nav-item">
            <span class="nav-link active">Carte</span>
          </li>
          <li id="list-button" class="nav-item">
            <span class="nav-link">Liste</span>
          </li>
          <li id="cr-button" class="nav-item">
            <span class="nav-link">Compte Rendu</span>
          </li>

          <li id="drd" class="nav-item">
            <div class="dropdown">
              <button
                class="btn btn-secondary dropdown-toggle"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Filtre
              </button>
              <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <div class="dropdown-item">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="resto-check"
                    checked
                  />
                  <label class="form-check-label" for="flexCheckDefault">
                    Resto
                  </label>
                </div>

                <div class="dropdown-item">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="travaux-check"
                    checked
                  />
                  <label class="form-check-label" for="flexCheckDefault">
                    Travaux
                  </label>
                </div>

                <div class="dropdown-item">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="velib-check"
                    checked
                  />
                  <label class="form-check-label" for="flexCheckDefault">
                    Velib
                  </label>
                </div>

                <button
                  id="reload-map-button"
                  class="btn btn-dark dropdown-item"
                >
                  Reload
                </button>
              </div>
            </div>
          </li>
        </ul>
      </header>
    </div>

    <main class="m-3">
      <div id="mappage">
        <div id="map"></div>
      </div>

      <div id="list">
        truc
      </div>

      <div id="resa" class="mx-auto text-center" style="width: 600px;">
        <h1 id="nom-resto">Veuillez selectionner un restaurant</h1>

        <div  class="py-5">
          <div class="form-group">
            <label for="date-input">Date de réservation</label>
            <input
              type="date"
              class="form-control"
              id="date-input"
              aria-describedby="emailHelp"
              placeholder="When"
            />
            <small id="emailHelp" class="form-text text-muted"
              >be carefull who you meet</small
            >
          </div>
          <div class="form-group">
            <label for="hour-input">Heure de réservation</label>
            <input
              type="time"
              class="form-control"
              id="hour-input"
              aria-describedby="emailHelp"
              placeholder="When"
            />
            <small id="emailHelp" class="form-text text-muted"
              >be carefull who you meet</small
            >
          </div>
          <div class="form-group">
            <label for="lastname-input">Nom d'utilisateur</label>
            <input
              type="text"
              class="form-control"
              id="lastname-input"
              placeholder="Dupont"
            />
          </div>
          <div class="form-group">
            <label for="name-input">Prénom d'utilisateur</label>
            <input
              type="text"
              class="form-control"
              id="name-input"
              placeholder="Jean"
            />
          </div>

          <div class="form-group">
            <label for="numero-input">Numero de Telephone</label>
            <input
              type="tel"
              class="form-control"
              id="numero-input"
              placeholder="0658694646"
            />
          </div>

          <div class="form-group">
            <label for="nombre-input">Nombre de places</label>
            <input
              type="number"
              class="form-control"
              id="nombre-input"
              placeholder="1"
            />
          </div>

          <button id="submitButton" class="btn btn-primary">Submit</button>
          <div
            class="hidden spinner-border text-primary"
            id="resa-spinner"
            role="status"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>

      <div id="cr"></div>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"
  ></script>
</body>
