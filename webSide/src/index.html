<!doctype html>
<head>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/main.css" />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
    defer
  ></script>
  <script src="js/index.js" defer></script>
</head>

<body class="card m-3 bg-dark">
  <div class="bg-light">
    <div >
      <header class="nav nav-fill m-2">
        <span id="map-button" class="btn btn-dark nav-item m-1">Carte</span>
        <span id="resa-button" class="btn btn-dark nav-item m-1"
          >Reservation</span
        >
        <span id="cr-button" class="btn btn-dark nav-item m-1"
          >Compte Rendu</span
        >
      </header>
    </div>

    <main class="m-3">
      <div id="map"></div>

      <div id="resa">
        <h1 id="nom-resto">Veuillez selectionner un restaurant</h1>

        <form>
          <div class="form-group">
            <label for="date-input">Date de réservation</label>
            <input
              type="date"
              class="form-control"
              id="date-input"
              aria-describedby="emailHelp"
              placeholder="When"
            />
            <small id="emailHelp" class="form-text text-muted"
              >be carefull who you meet</small
            >
          </div>
          <div class="form-group">
            <label for="name-input">Nom d'utilisateur</label>
            <input
              type="text"
              class="form-control"
              id="name-input"
              placeholder="You"
            />
          </div>
          <div class="form-group form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="exampleCheck1"
            />
            <label class="form-check-label" for="exampleCheck1"
              >Check me out</label
            >
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </form>
      </div>

      <div id="cr">
        <a href="https://github.com/PlumeDeRenard54/Projet_Prog_Rep"
          ><img src="data/GitHub_Invertocat_Black.png"
        /></a>
      </div>
    </main>
  </div>
</body>
