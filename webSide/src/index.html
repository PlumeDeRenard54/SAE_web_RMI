<!doctype html>
<head>
  <meta charset="utf-8" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/main.css" />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/index.js" defer></script>
</head>

<body class="card m-3 bg-dark">
  crossorigin="anonymous"
  <div id="mainbox" class="bg-light">
    <div>
      <header class="nav nav-fill m-2">
        <span id="mappage-button" class="btn btn-dark nav-item m-1">Carte</span>
        <span id="resa-button" class="btn btn-dark nav-item m-1"
          >Reservation</span
        >
        <span id="cr-button" class="btn btn-dark nav-item m-1"
          >Compte Rendu</span
        >
      </header>
    </div>

    <main class="m-3">
      <div id="mappage">
        <div id="map"></div>
        <div id="toggleButton" class="d-inline p-2">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="resto-check"
              checked
            />
            <label class="form-check-label" for="flexCheckDefault">
              Resto
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="velib-check"
              checked
            />
            <label class="form-check-label" for="flexCheckDefault">
              Velib
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="travaux-check"
              checked
            />
            <label class="form-check-label" for="flexCheckDefault">
              Travaux
            </label>

            <button id="reload-map-button" class="btn btn-dark">Reload</button>
          </div>
        </div>
      </div>

      <div id="resa" class="m-4 text-center">
        <h1 id="nom-resto">Veuillez selectionner un restaurant</h1>

        <div>
          <div class="form-group">
            <label for="date-input">Date de réservation</label>
            <input
              type="date"
              class="form-control"
              id="date-input"
              aria-describedby="emailHelp"
              placeholder="When"
            />
            <small id="emailHelp" class="form-text text-muted"
              >be carefull who you meet</small
            >
          </div>
          <div class="form-group">
            <label for="hour-input">Heure de réservation</label>
            <input
              type="time"
              class="form-control"
              id="hour-input"
              aria-describedby="emailHelp"
              placeholder="When"
            />
            <small id="emailHelp" class="form-text text-muted"
              >be carefull who you meet</small
            >
          </div>
          <div class="form-group">
            <label for="lastname-input">Nom d'utilisateur</label>
            <input
              type="text"
              class="form-control"
              id="lastname-input"
              placeholder="Dupont"
            />
          </div>
          <div class="form-group">
            <label for="name-input">Prénom d'utilisateur</label>
            <input
              type="text"
              class="form-control"
              id="name-input"
              placeholder="Jean"
            />
          </div>

          <div class="form-group">
            <label for="numero-input">Numero de Telephone</label>
            <input
              type="tel"
              class="form-control"
              id="numero-input"
              placeholder="0658694646"
            />
          </div>

          <div class="form-group">
            <label for="nombre-input">Nombre de places</label>
            <input
              type="number"
              class="form-control"
              id="nombre-input"
              placeholder="1"
            />
          </div>

          <button id="submitButton" class="btn btn-primary">Submit</button>
          <div
            class="hidden spinner-border text-primary"
            id="resa-spinner"
            role="status"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>

      <div id="cr">

      </div>
    </main>
  </div>
</body>
